name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # No private dependencies: this job runs on pull requests from forks.
  agent:
    name: agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-analyst-agent
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: data-analyst-agent/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build

  # Depends on the private @skyfire-xyz packages, so it cannot run on fork
  # pull requests. See CONTRIBUTING.md.
  dappier-seller-server:
    name: dappier-seller-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/dappier-seller-server
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: mcp-servers/dappier-seller-server/yarn.lock
      - name: Check npm credentials
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not available to this run, so the private @skyfire-xyz packages cannot be installed."
            echo "::error::GitHub does not expose secrets to pull requests opened from a fork. A maintainer must re-run this branch from the upstream repository. See CONTRIBUTING.md."
            exit 1
          fi
      - run: yarn install --frozen-lockfile
      - run: yarn build

  # Depends on the private @skyfire-xyz packages, so it cannot run on fork
  # pull requests. See CONTRIBUTING.md.
  reporting-server:
    name: reporting-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/reporting-server
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: mcp-servers/reporting-server/yarn.lock
      - name: Check npm credentials
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not available to this run, so the private @skyfire-xyz packages cannot be installed."
            echo "::error::GitHub does not expose secrets to pull requests opened from a fork. A maintainer must re-run this branch from the upstream repository. See CONTRIBUTING.md."
            exit 1
          fi
      - run: |
          cat > .npmrc <<'EOF'
          @skyfire-xyz:registry=https://registry.npmjs.org
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          EOF
      - run: yarn install --frozen-lockfile
      - run: yarn build
