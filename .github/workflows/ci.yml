name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent:
    name: agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-analyst-agent
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: data-analyst-agent/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build

  dappier-seller-server:
    name: dappier-seller-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/dappier-seller-server
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: mcp-servers/dappier-seller-server/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build

  reporting-server:
    name: reporting-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/reporting-server
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: mcp-servers/reporting-server/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build

  keycloak-custom-code:
    name: keycloak-custom-code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-token-exchange/skyfire-keycloak-custom-code
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B package
